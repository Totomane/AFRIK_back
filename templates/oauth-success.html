<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const provider = params.get("provider");
  window.opener.postMessage({ type: "oauth-success", provider }, window.location.origin);
  window.close();
</script>
</body>
</html>
